<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e08b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <radialGradient id="bgG" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1b1130" />
      <stop offset="100%" stop-color="#06040f" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7.68" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112.64" fill="url(#bgG)" stroke="#2e2646" stroke-width="5.12" />

  <!-- Inner ambient portal ring -->
  <circle cx="256" cy="266.24" r="194.56" fill="#7c3aed" opacity="0.08" />

  <g transform="translate(61.44, 61.44) scale(1.9456)" filter="url(#glow)">
    <!-- Outer Golden Arch -->
    <path d="M30 170 V80 L100 28 L170 80 V170" stroke="url(#goldG)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Middle Golden Arch -->
    <path d="M50 170 V90 L100 52 L150 90 V170" stroke="url(#goldG)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Golden Arch -->
    <path d="M70 170 V100 L100 74 L130 100 V170" stroke="url(#goldG)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Haute Couture Dress Mannequin Silhouette -->
    <g transform="translate(80, 102) scale(1.05)">
      <!-- Head Knob -->
      <circle cx="19" cy="8" r="4.5" fill="url(#goldG)" />
      <!-- Neck -->
      <rect x="17.5" y="12" width="3" height="4.5" fill="url(#goldG)" />
      <!-- Couture Silhouette -->
      <path d="M8 17 C8 17 13 20 19 20 C25 20 30 17 30 17 C32.5 24 29.5 33 26 39 C22.5 45 26 56 27 60 H11 C12 56 15.5 45 12 39 C8.5 33 5.5 24 8 17 Z" fill="url(#goldG)" />
      <!-- Stand Pole -->
      <line x1="19" y1="60" x2="19" y2="68" stroke="url(#goldG)" stroke-width="3" stroke-linecap="round" />
      <!-- Pedestal Base -->
      <ellipse cx="19" cy="68.5" rx="9" ry="2.5" fill="url(#goldG)" />
    </g>
  </g>
</svg>